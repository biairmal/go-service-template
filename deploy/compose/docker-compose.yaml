# The whole stack: Postgres, migrate, api, worker, Caddy and a daily backup.
#
# Local (`make up`): builds the image from this checkout and runs it with the
# config.yaml defaults (auth off, dev claims). `make run` still works next to
# it: the api container is reached through Caddy only, so host port 8080 stays
# free. `make up-obs` adds Prometheus, Grafana, Loki and Tempo; `make
# up-identity` adds a real go-identity on localhost:8081 and turns auth on.
#
# VPS: copy .env.example to .env next to this file, then
# `docker compose pull && docker compose up -d`. `migrate` runs first each
# time; `api` and `worker` wait for it. Caddy terminates TLS for DOMAIN.
#
# On first start the Postgres init script runs deploy/sql/bootstrap.sql, which
# creates the `app` schema and the `app` role the service connects as.
name: go-service-template

x-app: &app
  image: ${IMAGE:-ghcr.io/biairmal/go-service-template}:${IMAGE_TAG:-main}
  build:
    context: ../..
    args:
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
  env_file:
    - path: .env
      required: false
  environment:
    DB_HOST: postgres
    TRACING_ENABLED: ${TRACING_ENABLED:-false}
    OTEL_ENDPOINT: tempo:4317
    # Auth: off unless set here or in .env. `make up-identity` turns it on
    # against the identity profile's api.
    AUTH_ENABLED: ${AUTH_ENABLED:-false}
    AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://identity-api:8080/.well-known/jwks.json}
    AUTHZ_IDENTITY_URL: ${AUTHZ_IDENTITY_URL:-http://identity-api:8080}
    IDENTITY_CLIENT_SECRET: ${IDENTITY_CLIENT_SECRET:-}
  read_only: true
  tmpfs: [/tmp]
  restart: unless-stopped

# go-identity from a sibling checkout (IDENTITY_SRC, relative to this file
# unless absolute; `make up-identity` passes an absolute path).
x-identity: &identity
  profiles: [identity]
  image: go-identity:local
  build: ${IDENTITY_SRC:-../../../go-identity}
  environment:
    DB_HOST: postgres
    DB_USER: identity
    DB_PASSWORD: identity
    AUTH_ENABLED: "true"
    IDENTITY_PUBLIC_URL: http://localhost:8081
    # The dev super admin, created on identity's first start. The first
    # sign-in must change the password (POST /v1/me/password).
    SUPER_ADMIN_EMAIL: admin@example.com
    SUPER_ADMIN_PASSWORD: local-super-admin-1
  volumes:
    - ./identity.yaml:/app/config/config.yaml:ro
    - ${IDENTITY_SRC:-../../../go-identity}/keys:/etc/identity/keys:ro
  read_only: true
  tmpfs: [/tmp]
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_DB_PASSWORD: ${DB_PASSWORD:-app}
    ports:
      # Loopback only: `make run` and psql reach it from the host, the internet doesn't.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ../sql:/bootstrap:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["migrate", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["serve"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

  # Daily pg_dump into the `backups` volume (docs/runbooks/backup-restore.md).
  # Same image as `postgres`, so pg_dump's version always matches the server.
  # Runs as the `postgres` superuser so the dump holds the whole `app` database
  # (schema, the pgcrypto extension marker), not just what the `app` role owns.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: app
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -Fc -f "/backups/app-$$(date +%Y%m%d-%H%M%S).dump"
          find /backups -name '*.dump' -mtime "+$$BACKUP_KEEP_DAYS" -exec rm -f {} +
          sleep 86400
        done
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  # --- Profile identity (local only): a real go-identity on localhost:8081,
  # sharing this Postgres in its own `identity` schema. `make up-identity`.

  # Creates identity's schema and role with identity's own bootstrap.sql. Runs
  # on every start (the SQL is idempotent), so it also works on a volume that
  # `make up` created before the profile was first used.
  identity-db:
    profiles: [identity]
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: app
    command: ["psql", "-q", "-v", "ON_ERROR_STOP=1", "-v", "identity_password=identity", "-f", "/identity-sql/bootstrap.sql"]
    volumes:
      - ${IDENTITY_SRC:-../../../go-identity}/deploy/sql:/identity-sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  identity-migrate:
    <<: *identity
    command: ["migrate", "up"]
    restart: "no"
    depends_on:
      identity-db:
        condition: service_completed_successfully

  identity-api:
    <<: *identity
    command: ["serve"]
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      identity-migrate:
        condition: service_completed_successfully

  identity-worker:
    <<: *identity
    command: ["worker"]
    depends_on:
      identity-migrate:
        condition: service_completed_successfully

  # --- Profile obs: metrics, logs and traces, linked in Grafana (localhost:3000).
  # The api sends traces to Tempo when TRACING_ENABLED=true (`make up-obs` sets it).

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ./obs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  tempo:
    profiles: [obs]
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./obs/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo

  loki:
    profiles: [obs]
    image: grafana/loki:3.5.3
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./obs/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki

  # Ships this project's container logs (stdout JSON) to Loki.
  alloy:
    profiles: [obs]
    image: grafana/alloy:v1.10.2
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}
    volumes:
      - ./obs/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    profiles: [obs]
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      # Local convenience: anonymous admin. On a VPS, set GF_SECURITY_ADMIN_PASSWORD
      # and drop these two lines before publishing the port.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./obs/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  pgdata:
  caddy_data:
  backups:
  prometheus_data:
  tempo_data:
  loki_data:
  grafana_data:
