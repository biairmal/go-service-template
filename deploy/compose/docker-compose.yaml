# Local development (`make up`/`make down`): just Postgres. On first start the
# init script runs deploy/sql/bootstrap.sql, which creates the `app` schema and
# the `app` role the service connects as.
name: go-service-template

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      APP_DB_PASSWORD: ${DB_PASSWORD:-app}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ../sql:/bootstrap:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
