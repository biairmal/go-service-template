{{- if and .Values.route.enabled (eq .Values.route.kind "openshift") }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  host: {{ .Values.route.host | quote }}
  to:
    kind: Service
    name: {{ include "service.fullname" . }}
  port:
    targetPort: http
  {{- if .Values.route.tls.enabled }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  {{- end }}
{{- if .Values.route.blockInternalPath }}
---
# OpenShift's Route has no "deny" annotation, so the only
# portable way to keep /v1/internal off this public Route (see
# docs/DECISIONS.md) is a more specific Route for that path whose backend
# carries weight 0 and no alternateBackends; the HAProxy router answers 503
# for it instead of forwarding to the api Service.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "service.fullname" . }}-internal-block
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  host: {{ .Values.route.host | quote }}
  path: /v1/internal
  to:
    kind: Service
    name: {{ include "service.fullname" . }}
    weight: 0
  port:
    targetPort: http
  {{- if .Values.route.tls.enabled }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  {{- end }}
{{- end }}
{{- end }}
