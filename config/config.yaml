# Defaults for every environment. Values that differ per environment are
# written as ${ENV_VAR:default}; .env (local) or Secrets/ConfigMaps (clusters)
# feed the same keys. Secrets never live in this file.

service:
  name: ${SERVICE_NAME:note-service}
  version: ${SERVICE_VERSION:dev}             # set by CI from the git tag
  environment: ${APP_ENV:local}               # local | staging | production

http:
  addr: ${HTTP_ADDR::8080}
  read_header_timeout: 10s
  max_body_bytes: 1048576                     # 1 MiB request limit
  cors:
    allowed_origins: [${CORS_ORIGINS:http://localhost:3000}]

log:                                          # logger.Options
  level: ${LOG_LEVEL:info}
  format: ${LOG_FORMAT:json}                  # json in clusters, console locally
  output: stdout

database:                                     # sqlkit.Config
  leader:
    driver: postgres
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:app}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
    ssl_mode: ${DB_SSLMODE:disable}
    max_retries: 3
  followers: []                               # add replicas per environment
  pool: { max_open_conns: 25, max_idle_conns: 5, conn_max_lifetime: 5m }
  health: { enabled: true, check_interval: 10s, timeout: 2s }

auth:                                         # enabled + auth.Config
  enabled: ${AUTH_ENABLED:false}              # off: every route public, fixed dev caller; refused in production
  mode: local
  default_protected: true
  rules:
    - { pattern: /healthz, public: true }
    - { pattern: /readyz, public: true }
    - { pattern: /version, public: true }
    - { pattern: /metrics, public: true }
    - { method: GET, pattern: /swagger/**, public: true }   # API docs: basic auth instead of a token (swagger.enabled)
  local:
    algorithm: RS256
    jwks_url: ${AUTH_JWKS_URL:http://localhost:8081/.well-known/jwks.json}   # identity profile publishes 8081
    issuer: ${AUTH_ISSUER:identity}           # identity's modules.auth.token.issuer
    audience: ${AUTH_AUDIENCE:api}            # one of identity's modules.auth.token.audience
  cache_ttl: 30s

authz:                                        # go-sdk authz.Config; with auth off: source config, admin: ["*"]
  source: ${AUTHZ_SOURCE:identity}            # token | config | identity
  identity_url: ${AUTHZ_IDENTITY_URL:http://localhost:8081}
  cache_ttl: 1m                               # how long a tenant's role map stays fresh
  roles: {}                                   # used by source: config

identity:                                     # this service as one of identity's modules.auth.service_clients
  client_id: ${IDENTITY_CLIENT_ID:note-service}
  client_secret: ${IDENTITY_CLIENT_SECRET:}   # a secret; required when auth is on and authz.source is identity

tenancy:
  mode: ${TENANCY_MODE:single}                # must match identity's modules.tenant.mode

tracing:                                      # enabled + tracer.Config
  enabled: ${TRACING_ENABLED:false}
  endpoint: ${OTEL_ENDPOINT:localhost:4317}
  insecure: true
  sample_rate: 1.0

metrics:                                      # enabled + path + metrics.Config
  enabled: ${METRICS_ENABLED:true}
  path: /metrics
  namespace: ${METRICS_NAMESPACE:app}

swagger:
  enabled: ${SWAGGER_ENABLED:false}           # serve API docs at /swagger/index.html behind basic auth
  username: ${SWAGGER_USERNAME:}              # both required when enabled
  password: ${SWAGGER_PASSWORD:}              # a secret outside local

validator:
  field_name_tag: json

lifecycle:                                    # lifecycle.Config
  drain_delay: ${DRAIN_DELAY:5s}              # 0s locally, 5-10s in clusters
  shutdown_timeout: 20s
  closer_timeout: 10s
